<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achadinhos 🔥 | Catálogo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #222; }
  header { background: linear-gradient(135deg, #ff5a5a, #ff8c42); color: #fff; padding: 28px 16px 20px; text-align: center; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  header p { font-size: .85rem; opacity: .95; margin-bottom: 12px; }
  #busca { width: 100%; max-width: 480px; padding: 12px 16px; border: none; border-radius: 999px; font-size: 1rem; outline: none; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  #contagem { text-align: center; color: #888; font-size: .8rem; padding: 12px 0 0; }
  #grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 12px; max-width: 900px; margin: 0 auto; }
  .card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); display: flex; flex-direction: column; position: relative; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #eee; }
  .num { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.65); color: #fff; font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .info { padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .nome { font-size: .82rem; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.1em; }
  .btn { display: block; text-align: center; background: #22c55e; color: #fff; font-weight: 700; font-size: .85rem; padding: 10px; border-radius: 10px; text-decoration: none; }
  .btn:active { transform: scale(.97); }
  #vazio { text-align: center; color: #999; padding: 40px 16px; display: none; }
  footer { text-align: center; color: #aaa; font-size: .75rem; padding: 24px 12px; }
</style>
</head>
<body>
<header>
  <h1>🔥 Achadinhos</h1>
  <p>Pesquise pelo nome ou pelo número do produto</p>
  <input id="busca" type="search" placeholder="🔍 Buscar produto ou nº..." autocomplete="off">
</header>
<div id="contagem"></div>
<div id="grade"></div>
<div id="vazio">Nenhum produto encontrado. Tente outro termo. 🔍</div>
<footer>@achadinhosrisoletivo · links de afiliado Shopee</footer>
<script>
let produtos = [];
const grade = document.getElementById('grade');
const busca = document.getElementById('busca');
const contagem = document.getElementById('contagem');
const vazio = document.getElementById('vazio');

function card(p) {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML =
    '<span class="num">#' + p.numero + '</span>' +
    '<img loading="lazy" src="' + p.foto.replace(/"/g, '') + '" alt="">' +
    '<div class="info"><div class="nome"></div>' +
    '<a class="btn" href="' + p.affiliate_link.replace(/"/g, '') + '" target="_blank" rel="noopener">Ver oferta 🟢</a></div>';
  el.querySelector('.nome').textContent = p.nome;
  return el;
}
function render(lista) {
  grade.innerHTML = '';
  lista.forEach(p => grade.appendChild(card(p)));
  contagem.textContent = lista.length + ' produto' + (lista.length === 1 ? '' : 's');
  vazio.style.display = lista.length ? 'none' : 'block';
}
function filtrar() {
  const q = busca.value.trim().toLowerCase().replace(/^#/, '');
  if (!q) { render(produtos); return; }
  render(produtos.filter(p =>
    p.nome.toLowerCase().includes(q) || String(p.numero) === q
  ));
}
busca.addEventListener('input', filtrar);
fetch('produtos.json')
  .then(r => r.json())
  .then(d => { produtos = d.produtos || []; render(produtos); })
  .catch(() => { vazio.style.display = 'block'; vazio.textContent = 'Erro ao carregar o catálogo.'; });
</script>
</body>
</html>
